name: Weekly report generation

on:
  workflow_dispatch:
    inputs:
      weekStart:
        description: 'YYYY-MM-DD Monday to generate. Empty means previous completed week.'
        required: false
        type: string
      dryRun:
        description: 'Calculate targets without writing reports or notifications.'
        required: false
        default: false
        type: boolean
      forceRegenerate:
        description: 'Replace existing reports for the requested week.'
        required: false
        default: false
        type: boolean

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger weekly report generation
        env:
          API_URL: ${{ secrets.YOUGABELL_API_URL }}
          CRON_SECRET: ${{ secrets.WEEKLY_REPORT_CRON_SECRET }}
          WEEK_START: ${{ inputs.weekStart }}
          DRY_RUN: ${{ inputs.dryRun || false }}
          FORCE_REGENERATE: ${{ inputs.forceRegenerate || false }}
        run: |
          node --input-type=module <<'NODE'
          const apiUrl = process.env.API_URL;
          const cronSecret = process.env.CRON_SECRET;
          if (!apiUrl || !cronSecret) {
            throw new Error('YOUGABELL_API_URL and WEEKLY_REPORT_CRON_SECRET secrets are required.');
          }

          const body = {};
          if (process.env.WEEK_START) body.weekStart = process.env.WEEK_START;
          if (process.env.DRY_RUN === 'true') body.dryRun = true;
          if (process.env.FORCE_REGENERATE === 'true') body.forceRegenerate = true;

          const response = await fetch(`${apiUrl.replace(/\/$/, '')}/internal/weekly-reports/generate`, {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'x-cron-secret': cronSecret,
            },
            body: JSON.stringify(body),
          });
          const text = await response.text();
          if (!response.ok) {
            throw new Error(`Weekly report generation failed: ${response.status} ${text}`);
          }
          console.log(text);
          NODE
