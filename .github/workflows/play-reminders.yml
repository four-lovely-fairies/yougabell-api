name: Play reminder notifications

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      now:
        description: 'RFC3339 override time. Empty means current server time.'
        required: false
        type: string
      dryRun:
        description: 'Calculate targets without writing notifications.'
        required: false
        default: false
        type: boolean
      windowMinutes:
        description: 'How many trailing minutes to include for due matching.'
        required: false
        default: '10'
        type: string

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger play reminder dispatch
        env:
          API_URL: ${{ secrets.YOUGABELL_API_URL }}
          CRON_SECRET: ${{ secrets.NOTIFICATION_CRON_SECRET }}
          NOW: ${{ inputs.now }}
          DRY_RUN: ${{ inputs.dryRun || false }}
          WINDOW_MINUTES: ${{ inputs.windowMinutes || '10' }}
        run: |
          node --input-type=module <<'NODE'
          const apiUrl = process.env.API_URL;
          const cronSecret = process.env.CRON_SECRET;
          if (!apiUrl || !cronSecret) {
            throw new Error('YOUGABELL_API_URL and NOTIFICATION_CRON_SECRET secrets are required.');
          }

          const body = {
            windowMinutes: Number(process.env.WINDOW_MINUTES || '10'),
          };
          if (process.env.NOW) body.now = process.env.NOW;
          if (process.env.DRY_RUN === 'true') body.dryRun = true;

          const response = await fetch(`${apiUrl.replace(/\/$/, '')}/internal/notifications/dispatch-play-reminders`, {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'x-cron-secret': cronSecret,
            },
            body: JSON.stringify(body),
          });
          const text = await response.text();
          if (!response.ok) {
            throw new Error(`Play reminder dispatch failed: ${response.status} ${text}`);
          }
          console.log(text);
          NODE
