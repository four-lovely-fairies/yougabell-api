name: Warm API (Render free tier)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping API root
        env:
          API_URL: ${{ secrets.YOUGABELL_API_URL }}
        run: |
          set -e
          base="${API_URL:-https://yougabell-api.onrender.com}"
          base="${base%/}"
          echo "Pinging ${base}/"
          # -m 90 → cold start can take ~50s on Render free tier
          status=$(curl -s -o /dev/null -m 90 -w "%{http_code}" "${base}/")
          echo "HTTP ${status}"
          # 200~399만 통과
          [ "${status}" -ge 200 ] && [ "${status}" -lt 400 ]
